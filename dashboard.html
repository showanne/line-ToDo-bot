<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE To-Do 看板</title>
    <style>
        :root {
            --primary-color: #E67E22;
            --bg-color: #F8F9FA;
            --sidebar-bg: #FFFFFF;
            --text-main: #343A40;
            --text-secondary: #6C757D;
            --accent-green: #1DB446;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        aside { width: 280px; background: var(--sidebar-bg); border-right: 1px solid #EEE; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.02); }
        .sidebar-header { padding: 30px 20px; font-size: 20px; font-weight: 800; color: var(--primary-color); border-bottom: 1px solid #F5F5F5; }
        .sidebar-section { padding: 20px 0; border-bottom: 1px solid #F5F5F5; }
        .sidebar-section h3 { padding: 0 20px 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); }
        .nav-item { padding: 10px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--text-main); transition: var(--transition); border-left: 4px solid transparent; }
        .nav-item:hover { background: #FFF5EC; color: var(--primary-color); }
        .nav-item.active { background: #FFF5EC; color: var(--primary-color); border-left-color: var(--primary-color); font-weight: bold; }
        .badge { background: #EEE; color: #888; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .active .badge { background: var(--primary-color); color: #FFF; }

        /* Main Content */
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .content-header { padding: 30px 40px; background: #FFF; border-bottom: 1px solid #EEE; display: flex; justify-content: space-between; align-items: center; }
        .content-header h1 { font-size: 24px; font-weight: 800; }
        .status-summary { display: flex; gap: 20px; }
        .status-summary span { font-size: 14px; color: var(--text-secondary); }

        .items-grid { padding: 30px 40px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; align-content: start; }
        
        /* Card UI */
        .todo-card { background: #FFF; padding: 25px; border-radius: 16px; box-shadow: var(--card-shadow); transition: var(--transition); border: 1px solid #F0F0F0; position: relative; overflow: hidden; }
        .todo-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
        .todo-card.done { opacity: 0.6; }
        .todo-card.done .title { text-decoration: line-through; color: var(--text-secondary); }

        .card-path { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; font-weight: bold; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; line-height: 1.4; }
        
        .card-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .tag-pill { font-size: 11px; padding: 4px 10px; border-radius: 8px; background: #E8F5E9; color: var(--accent-green); }
        .place-pill { font-size: 11px; padding: 4px 10px; border-radius: 8px; background: #E3F2FD; color: #1E88E5; }

        .card-footer { border-top: 1px solid #F5F5F5; padding-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .item-id { color: #BBB; font-size: 12px; font-family: monospace; }
        .status-badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; }
        .status-pending { background: #FFF3E0; color: #EF6C00; }
        .status-done { background: #F1F8E9; color: #33691E; }

        /* Animation */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .todo-card { animation: fadeIn 0.4s ease forwards; }

        /* Scrollbar Customization */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #DDD; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #CCC; }
    </style>
</head>
<body>
    <aside id="sidebar">
        <div class="sidebar-header">TO-DO 看板</div>
        
        <div class="sidebar-section">
            <div class="nav-item active" id="btn-all" onclick="filterBy('all', null, this)">
                <span>📂 所有事項</span>
                <span class="badge" id="total-badge">0</span>
            </div>
        </div>

        <div class="sidebar-section" id="categories-list">
            <h3>主分類</h3>
        </div>

        <div class="sidebar-section" id="tags-list">
            <h3>熱門標籤</h3>
        </div>

        <div class="sidebar-section" id="places-list">
            <h3>地點</h3>
        </div>
    </aside>

    <main>
        <header class="content-header">
            <h1 id="current-filter-title">所有待辦事項</h1>
            <div class="status-summary">
                <span>未完成: <strong id="pending-count" style="color: var(--primary-color)">0</strong></span>
                <span>已完成: <strong id="done-count">0</strong></span>
            </div>
        </header>

        <div class="items-grid" id="items-grid">
        </div>
    </main>

    <script>
        let allData = { items: [], categories: [], tags: [], places: [] };
        let currentFilter = { type: 'all', val: null };

        async function loadData() {
            try {
                const [itemsRes, catsRes, tagsRes, placesRes] = await Promise.all([
                    fetch('/api/data'),
                    fetch('/api/categories'),
                    fetch('/api/tags'),
                    fetch('/api/places')
                ]);

                allData.items = (await itemsRes.json()).items || [];
                allData.categories = await catsRes.json() || [];
                allData.tags = await tagsRes.json() || [];
                allData.places = await placesRes.json() || [];

                renderSidebar();
                applyFilter();
            } catch (err) {
                console.error('資料載入失敗:', err);
            }
        }

        function renderSidebar() {
            const catList = document.getElementById('categories-list');
            catList.innerHTML = '<h3>主分類</h3>';
            allData.categories.forEach(cat => {
                const item = createNavItem(`📁 ${cat.name}`, cat.count, () => filterBy('category', cat.name, item));
                catList.appendChild(item);
                if (currentFilter.type === 'category' && currentFilter.val === cat.name) item.classList.add('active');
            });

            const tagList = document.getElementById('tags-list');
            tagList.innerHTML = '<h3>熱門標籤</h3>';
            allData.tags.forEach(tag => {
                const item = createNavItem(`# ${tag.name}`, tag.count, () => filterBy('tag', tag.name, item));
                tagList.appendChild(item);
                if (currentFilter.type === 'tag' && currentFilter.val === tag.name) item.classList.add('active');
            });

            const placeList = document.getElementById('places-list');
            placeList.innerHTML = '<h3>地點</h3>';
            allData.places.forEach(p => {
                const item = createNavItem(`📍 ${p.name}`, p.count, () => filterBy('place', p.name, item));
                placeList.appendChild(item);
                if (currentFilter.type === 'place' && currentFilter.val === p.name) item.classList.add('active');
            });

            document.getElementById('total-badge').innerText = allData.items.filter(i => !i.done).length;
        }

        function createNavItem(text, count, onClick) {
            const div = document.createElement('div');
            div.className = 'nav-item';
            div.innerHTML = `<span>${text}</span><span class="badge">${count}</span>`;
            div.onclick = (e) => {
                onClick();
            };
            return div;
        }

        function filterBy(type, val, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            
            currentFilter = { type, val };
            applyFilter();
        }

        function applyFilter() {
            let filtered = allData.items;
            let title = '所有待辦事項';

            if (currentFilter.type === 'category') {
                filtered = allData.items.filter(i => i.category_name === currentFilter.val);
                title = `主分類: ${currentFilter.val}`;
            } else if (currentFilter.type === 'tag') {
                filtered = allData.items.filter(i => i.tags && i.tags.includes(currentFilter.val));
                title = `標籤: #${currentFilter.val}`;
            } else if (currentFilter.type === 'place') {
                filtered = allData.items.filter(i => i.place === currentFilter.val);
                title = `地點: @${currentFilter.val}`;
            }

            document.getElementById('current-filter-title').innerText = title;
            renderItems(filtered);
        }

        function renderItems(items) {
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            
            const pending = items.filter(i => !i.done);
            const done = items.filter(i => i.done);
            
            document.getElementById('pending-count').innerText = pending.length;
            document.getElementById('done-count').innerText = done.length;

            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #CCC; font-size: 20px;">這裡還沒有事項喔 😊</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = `todo-card ${item.done ? 'done' : ''}`;
                
                let subCats = item.sub_categories ? item.sub_categories.join(', ') : '';
                let tags = item.tags ? item.tags.map(t => `<span class="tag-pill">#${t}</span>`).join('') : '';
                let place = item.place ? `<span class="place-pill">📍 ${item.place}</span>` : '';

                card.innerHTML = `
                    <div class="card-path">${item.category_name} ${subCats ? ' > ' + subCats : ''}</div>
                    <div class="card-title">${item.title}</div>
                    <div class="card-meta">
                        ${tags}
                        ${place}
                    </div>
                    <div class="card-footer">
                        <span class="item-id">#${item.id}</span>
                        <span class="status-badge ${item.done ? 'status-done' : 'status-pending'}">
                            ${item.done ? '已完成' : '未完成'}
                        </span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        loadData();
        setInterval(loadData, 30000); // 30秒更新一次
    </script>
</body>
</html>
